source_project_name: chromium
source_project_version: 136.0.7103.48-1
issue: |
    The build is failing because the Rust code in the skrifa crate is using a method is_none_or on an Option that doesn't exist in the version of Rust being used for the build (Rust 1.79.0). The error message suggests using is_none instead.
    The is_none_or method was probably introduced in a later version of Rust. The code in ../../third_party/rust/chromium_crates_io/vendor/skrifa-0.29.2/src/glyph_name.rs at line 97 is likely checking if an Option is either None or contains an empty string.
log_detective_version: 3.10.0
log_detective_analysis: |
    The provided log snippets do not contain any error messages or indications of a build failure. All snippets show successful debug steps, dependency resolution, and package installations. Without an error message, the root cause cannot be determined from the given information.
log_files:
    - build.log
notes: |
    The included log file contains (already) publicly leaked Google API key, which has been revoked and was for the longest time (Publicly leaked secret since ~2017) leaked multiple times across multiple chromium-related repositories.

    Sample comes from packager-annotated notes submitted to logdetective.com.
    Additional text contains more context.

    Resolution: There are 2 options to resolve the build failure:
    1. Update rust compiler to newer version 1.86
    2. The is_none_or method was probably introduced in a later version of Rust. The code in ../../third_party/rust/chromium_crates_io/vendor/skrifa-0.29.2/src/glyph_name.rs at line 97 is checking if an Option is either None or contains an empty string.
    Modify that line of code like following:
    Original code:
    if name.as_ref().is_none_or(|s| s.is_empty()) {
    Fixed code:
    if name.is_none() || name.as_ref().map_or(false, |s| s.is_empty()) {


source_project_name: python-gensim
source_project_version: 0.10.0-38
issue: |
    Incompatible pointer types caused a compilation error in `gensim_addons/models/word2vec_inner.pyx`. The cause is possibly incompatible versions of Cython and numpy.
log_detective_version: 3.10.0
log_detective_analysis: |
    The build failed due to a C compilation error in `gensim_addons/models/word2vec_inner.c` caused by an assignment of an incompatible pointer type. This indicates an issue with the generated C code, likely from Cython, possibly due to a mismatch in `numpy` or `Cython` versions used during code generation and compilation. The solution is to ensure compatible versions of `Cython` and `numpy` are used to generate and compile the C extension, or to patch the source to resolve the pointer type incompatibility.
log_files:
    - builder-live.log
    - backend.log
    - build.log
notes: |
    Sample comes from packager-annotated notes submitted to logdetective.com.
    Additional text contains more context.

    Resolution: Ensure assignment of compatible pointer types to variables.


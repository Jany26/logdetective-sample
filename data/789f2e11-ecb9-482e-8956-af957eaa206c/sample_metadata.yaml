    List of unmet dependencies:
    python(abi) = 3.13
    python3.13dist(certifi) >= 2017.4.17
    (python3.13dist(charset-normalizer) < 4~~ with python3.13dist(charset-normalizer) >= 2)
    (python3.13dist(idna) < 4~~ with python3.13dist(idna) >= 2.5)
